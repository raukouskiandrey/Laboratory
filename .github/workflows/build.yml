name: Build & SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    env:
      SONAR_ORG: raukouskiandrey
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v6

      - name: Build Laba7
        run: |
          rm -rf Laba7/build
          mkdir Laba7/build
          cmake -S Laba7 -B Laba7/build
          build-wrapper-linux-x86-64 --out-dir Laba7/build_wrapper make -C Laba7/build

      - name: SonarCloud scan Laba7
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=raukouskiandrey_Laba7
            -Dsonar.organization=${{ env.SONAR_ORG }}
            -Dsonar.sources=Laba7
            -Dsonar.cfamily.compile-commands=Laba7/build_wrapper/compile_commands.json
            -Dsonar.coverage.exclusions=**
            -Dsonar.cfamily.skipCoverage=true